services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "max_connections=40"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 120s
      timeout: 15s
      start_period: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy allkeys-lru --save 60 1"]
    environment:
      - REDIS_PASSWORD=redis_password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 120s
      timeout: 15s
      start_period: 5s
      retries: 5

  chatwoot:
    image: chatwoot/chatwoot:v4.17.0
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres_password@postgres:5432/chatwoot_production
      - REDIS_URL=redis://:redis_password@redis:6379
      - REDIS_PASSWORD=redis_password
      - MALLOC_ARENA_MAX=2
      - EMBED_SIDEKIQ=true
      - SIDEKIQ_CONCURRENCY=2
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
      - WEB_CONCURRENCY=0
      - RAILS_MAX_THREADS=3
    volumes:
      - ./99_embedded_sidekiq.rb:/app/config/initializers/99_embedded_sidekiq.rb:ro
    ports:
      - "3000:3000"
    command: ['sh', '-c', 'rm -f /app/tmp/pids/server.pid && bundle exec rails s -p 3000 -b 0.0.0.0']

  sidekiq:
    image: chatwoot/chatwoot:v4.17.0
    profiles: ["extras"]
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgres://postgres:postgres_password@postgres:5432/chatwoot_production
      - REDIS_URL=redis://:redis_password@redis:6379
      - REDIS_PASSWORD=redis_password
      - MALLOC_ARENA_MAX=2
      - SIDEKIQ_CONCURRENCY=2
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  typebot-builder:
    image: baptistearno/typebot-builder:latest
    profiles: ["extras"]
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/typebot
      - NODE_OPTIONS=--max-old-space-size=256 --no-node-snapshot
    depends_on:
      - postgres
      - redis
    ports:
      - "8082:3000"

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/typebot
      - NODE_OPTIONS=--max-old-space-size=256 --no-node-snapshot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:3000"

  lipagas-bridge:
    build: ../lipagas_bridge
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://:redis_password@redis:6379
      - CHATWOOT_URL=http://chatwoot:3000
      - TYPEBOT_VIEWER_URL=http://typebot-viewer:3000
      - ERL_FLAGS=+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  joywo-bridge:
    build: ../joywo_bridge
    profiles: ["extras"]
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://:redis_password@redis:6379
    depends_on:
      - redis
    ports:
      - "4001:4001"

  presidential-bridge:
    build: ../presidential_bridge
    restart: always
    env_file: .env
    environment:
      - CHATWOOT_BOT_TOKEN=zXDW1wqKjXqH2uZmR7rZSDi5
      - REDIS_URL=redis://:redis_password@redis:6379
      - TYPEBOT_VIEWER_URL=http://typebot-viewer:3000
      - CHATWOOT_URL=http://chatwoot:3000
      - ENABLE_DATA_MINER=false
      - ERL_FLAGS=+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none
    volumes:
      - ../presidential_bridge/lib:/app/lib
    depends_on:
      - redis
    ports:
      - "4002:4002"

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/html/planna-logo.webp:/usr/share/nginx/html/planna-logo.webp:ro
      - ./nginx/html/planna-logo-icon.webp:/usr/share/nginx/html/planna-logo-icon.webp:ro
      - ./nginx/html/planna-favicon.ico:/usr/share/nginx/html/planna-favicon.ico:ro
      - ./nginx/html/planna-apple-touch-icon.png:/usr/share/nginx/html/planna-apple-touch-icon.png:ro
      - ./nginx/html/planna-theme.css:/usr/share/nginx/html/planna-theme.css:ro
      - ./nginx/html/planna-spinner.js:/usr/share/nginx/html/planna-spinner.js:ro
      - ./nginx/html/avatars:/usr/share/nginx/html/avatars:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - chatwoot
      - typebot-viewer
      - lipagas-bridge
    networks:
      default:
        aliases:
          - chat.lipagas.co
          - flow.lipagas.co
          - builder.lipagas.co
          - chat.hisia.app
          - flow.hisia.app
          - builder.hisia.app

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres-data:
  redis-data:
