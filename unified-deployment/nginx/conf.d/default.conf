map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chat.lipagas.co builder.lipagas.co flow.lipagas.co planna.lipagas.co
                chat.hisia.app builder.hisia.app flow.hisia.app planna.hisia.app;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chat.lipagas.co chat.hisia.app;
    
    ssl_certificate /etc/letsencrypt/live/chat.lipagas.co-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.lipagas.co-0001/privkey.pem;

    location = /brand-assets/logo.svg {
        alias /etc/nginx/conf.d/branding/influence/logo_dark.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /brand-assets/logo_dark.svg {
        alias /etc/nginx/conf.d/branding/influence/logo_dark.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /brand-assets/logo_thumbnail.svg {
        alias /etc/nginx/conf.d/branding/influence/favicon.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /brand-assets/favicon.svg {
        alias /etc/nginx/conf.d/branding/influence/favicon.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico {
        alias /etc/nginx/conf.d/branding/influence/favicon.ico;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* ^/(favicon.*|apple-icon.*|android-icon.*|ms-icon.*)\.png$ {
        alias /etc/nginx/conf.d/branding/influence/$1.png;
        default_type image/png;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* ^/(favicon.*|apple-icon.*|android-icon.*|ms-icon.*)\.svg$ {
        alias /etc/nginx/conf.d/branding/influence/favicon.svg;
        default_type image/svg+xml;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    location / {
        proxy_pass http://chatwoot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

