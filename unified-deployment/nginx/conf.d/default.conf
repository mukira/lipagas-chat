        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook {
        set $lipagas_bridge_upstream http://lipagas-bridge:4000;
        proxy_pass $lipagas_bridge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook-joywo {
        set $joywo_bridge_upstream http://joywo-bridge:4001;
        proxy_pass $joywo_bridge_upstream/webhook$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook-presidential {
        set $presidential_bridge_upstream http://presidential-bridge:4002;
        proxy_pass $presidential_bridge_upstream/webhook$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ai/ {
        set $presidential_bridge_upstream http://presidential-bridge:4002;
        proxy_pass $presidential_bridge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $typebot_viewer_upstream http://typebot-viewer:3000;
        proxy_pass $typebot_viewer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host flow.lipagas.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name planna.hisia.app planna.lipagas.co;
    
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    location = /planna-logo.webp {
        alias /usr/share/nginx/html/planna-logo.webp;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/planna-favicon.ico;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html/planna-apple-touch-icon.png;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-theme.css {
        alias /usr/share/nginx/html/planna-theme.css;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-logo-icon.webp {
        alias /usr/share/nginx/html/planna-logo-icon.webp;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-testimonials.js {
        alias /usr/share/nginx/html/planna-testimonials.js;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-spinner.js {
        alias /usr/share/nginx/html/planna-spinner.js;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location /avatars/ {
        alias /usr/share/nginx/html/avatars/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /auth/avatars/ {
        alias /usr/share/nginx/html/avatars/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://172.17.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types *;
    }
}
