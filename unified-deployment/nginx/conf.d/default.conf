server {
    listen 443 ssl;
    server_name planna.hisia.app planna.lipagas.co;
    
    ssl_certificate /etc/letsencrypt/live/planna.hisia.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planna.hisia.app/privkey.pem;

    # Serve the Planna logo as a static file (MUST be before the catch-all location /)
    location = /planna-logo.webp {
        alias /usr/share/nginx/html/planna-logo.webp;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/planna-favicon.ico;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html/planna-apple-touch-icon.png;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-theme.css {
        alias /usr/share/nginx/html/planna-theme.css;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-logo-icon.webp {
        alias /usr/share/nginx/html/planna-logo-icon.webp;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-testimonials.js {
        alias /usr/share/nginx/html/planna-testimonials.js;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location = /planna-spinner.js {
        alias /usr/share/nginx/html/planna-spinner.js;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    location /avatars/ {
        alias /usr/share/nginx/html/avatars/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /auth/avatars/ {
        alias /usr/share/nginx/html/avatars/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://172.17.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Stop upstream from gzip compressing so sub_filter works
        proxy_set_header Accept-Encoding "";
        
        # Inject our CSS + new favicon, and remove the original favicon tag
        sub_filter '<link rel="icon" href="/favicon.ico" sizes="any"/>' '';
        sub_filter '<title>Planna Register</title>' '<title>Planna - Social Media Scheduling Application</title>';
        sub_filter '</head>' '<meta name="description" content="Planna is a social media scheduling application that helps you plan, automate, and manage your online presence."><link rel="icon" href="/favicon.ico?v=2" type="image/x-icon"><link rel="stylesheet" href="/planna-theme.css"><script src="/planna-spinner.js" defer></script></head>';

        # Direct SVG->img swap: replace the exact Postiz 60x60 sidebar icon with our logo
        sub_filter '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none" class="mt-[8px] min-w-[60px] min-h-[60px]">' '<img src="/planna-logo-icon.webp" width="60" height="60" alt="Planna" style="object-fit:contain;" data-nimg="1" /><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none" class="mt-[8px] min-w-[60px] min-h-[60px]" style="display:none">';

        # Kenyan Testimonial Hard-Baking (14 rules)
        sub_filter 'Vincent L.' 'Muthoni W.';
        sub_filter 'Dilini R.' 'Akinyi O.';
        sub_filter 'Johannes D.' 'Odhiambo O.';
        sub_filter 'George B.' 'Waweru W.';
        sub_filter 'Maria Camila A.' 'Fatuma Hassan A';
        sub_filter 'Bartolomeo H.' 'Kipkorir M. K';
        sub_filter 'Kiley H.' 'Njeri K.';
        
        sub_filter 'different industries.' 'Kenyan industry apps.';
        sub_filter 'all-in-one marketing platforms' 'Nairobi based marketing suites';
        sub_filter 'As a privacy-first company' 'As a Nairobi based company';
        sub_filter 'jump in and start scheduling.' 'plan our Kenyan social posts.';
        sub_filter 'how we manage our social media presence' 'how we run our Nairobi social campaigns';
        sub_filter 'scheduling automation.' 'Kenyan campaigns fast.';
        sub_filter 'aligned across all platforms.' 'aligned across Kenyan brands.';
        
        sub_filter '20,000+' '200+';
        sub_filter_once off;
        sub_filter_types *;
    }
}
