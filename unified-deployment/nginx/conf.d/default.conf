map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name chat.lipagas.co builder.lipagas.co flow.lipagas.co planna.lipagas.co
                chat.hisia.app builder.hisia.app flow.hisia.app planna.hisia.app;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chat.lipagas.co chat.hisia.app;
    
    ssl_certificate /etc/letsencrypt/live/chat.lipagas.co-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.lipagas.co-0001/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /brand-assets/logo.svg {
        alias /etc/nginx/conf.d/branding/influence/logo_dark.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /brand-assets/logo_dark.svg {
        alias /etc/nginx/conf.d/branding/influence/logo_dark.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /brand-assets/logo_thumbnail.svg {
        alias /etc/nginx/conf.d/branding/influence/favicon.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /brand-assets/favicon.svg {
        alias /etc/nginx/conf.d/branding/influence/favicon.svg;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico {
        alias /etc/nginx/conf.d/branding/influence/favicon.ico;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* ^/(favicon.*|apple-icon.*|android-icon.*|ms-icon.*)\.png$ {
        alias /etc/nginx/conf.d/branding/influence/$1.png;
        default_type image/png;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* ^/(favicon.*|apple-icon.*|android-icon.*|ms-icon.*)\.svg$ {
        alias /etc/nginx/conf.d/branding/influence/favicon.svg;
        default_type image/svg+xml;
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    location / {
        sub_filter 'href="/favicon' 'href="/favicon';
        sub_filter '.png"' '.png?v=3"';
        sub_filter 'logo_dark.svg' 'logo_dark.svg?v=3';
        sub_filter 'logo.svg' 'logo_dark.svg?v=3';
        sub_filter_once off;
        sub_filter_types application/javascript;

        set $chatwoot_upstream http://chatwoot:3000;
        proxy_pass $chatwoot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
    }
}

server {
    listen 443 ssl;
    server_name builder.lipagas.co builder.hisia.app;
    
    ssl_certificate /etc/letsencrypt/live/builder.lipagas.co-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/builder.lipagas.co-0001/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $typebot_builder_upstream http://typebot-builder:3000;
        proxy_pass $typebot_builder_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name flow.lipagas.co flow.hisia.app;
    
    ssl_certificate /etc/letsencrypt/live/flow.lipagas.co-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flow.lipagas.co-0001/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /meta-webhook {
        set $lipagas_bridge_upstream http://lipagas-bridge:4000;
        proxy_pass $lipagas_bridge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /trigger-mpesa {
        set $lipagas_bridge_upstream http://lipagas-bridge:4000;
        proxy_pass $lipagas_bridge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /parse-cart {
        set $lipagas_bridge_upstream http://lipagas-bridge:4000;
